<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form(Embedded CSS)</title>
    <style>
        body {
            background-color: rgb(248, 231, 231);
            background-image: url('background.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: navy;
            text-align: center;
        }
        label {
            font-weight: bold;
        }
        input[type="text"], input[type="tel"], input[type="email"], input[type="password"], select {
            width: 100%;
            padding: 8px;
            margin: 4px 0;
            box-sizing: border-box;
        }
              #uname {
                background-color: navy;
            }
            .unamelabel {
                background-color: lightgreen;
            }
        
        input[type="submit"], input[type="reset"] {
            background-color: navy;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
        input[type="submit"]:hover, input[type="reset"]:hover {
            background-color: darkblue;
        }
    </style>
    
</head>
<body>
<h1>Registration Form(Embedded CSS)</h1>
<nav class="navbar">
    <a href="index.html">Home</a> |
    <a href="practice.html">Practice</a> |
    <a href="table.html">Table</a>
</nav>
<table>
    <tr>
        <td>
            <label class="unamelabel">Enter your name:</label>
        </td>
        <td>
            <input type="text" name="uname" required>
        </td>
    </tr>
    <tr>
        <td>
            <label>Enter your Father's name:</label>
        </td>
        <td>
            <input type="text" name="fname" required>
        </td>
    </tr>
    <tr>
        <td>
            <label>Enter your Mother's name:</label>
        </td>
        <td>
            <input type="text" name="mname" required>
        </td>
    </tr>
    <tr>
        <td>
            <label>Enter your Mobile number:</label>
        </td>
        <td>
            <input type="tel" name="mobile" required>
        </td>
    </tr>
    <tr>
        <td>
            <label>Enter your Email:</label>
        </td>
        <td>
            <input type="email" name="email" required>
        </td>
    </tr>
    <tr>
        <td>
            <label>Enter your Address:</label>
        </td>
        <td>
            <input type="text" name="address" required>
        </td>
    </tr>
</table>
<label>Enter your Gender:</label><br>
<input type="radio" name="gender" value="male" required> Male
<input type="radio" name="gender" value="female" required> Female
<input type="radio" name="gender" value="other" required> Other<br><br>
<label>Enter your Hobbies:</label><br>
<input type="checkbox" name="hobbies" value="reading" required> Reading
<input type="checkbox" name="hobbies" value="writing" required> Writing
<input type="checkbox" name="hobbies" value="swimming" required> Swimming<br><br>
<label>Select your country:</label><br>
<select name="country" required>
    <option value="india">India</option>
    <option value="usa">USA</option>
    <option value="uk">UK</option>
    <option value="australia">Australia</option>
</select><br><br>
<label>Select your state:</label><br> 
<select name="state" required>
    <option value="maharashtra">Maharashtra</option>
    <option value="gujarat">Gujarat</option>
    <option value="rajasthan">Rajasthan</option>
    <option value="punjab">Punjab</option>
</select><br><br>
<label style="color: red;
font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
font-size: 50px;
padding: auto;
font-style: italic;">(Inline CSS) Enter your password:</label><br>
<input type="password" name="pwd" required><br><br>
<label>Select your date of birth:</label><br>
<input type="date" name="dob" required><br><br>
<input type="reset" value="Reset">
<input type="submit" value="Submit">
</body>
</html>
</body>
</html>
